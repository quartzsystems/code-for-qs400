[workspace]
resolver = "3"
members = [
    "crates/host-rpc",
    "crates/code-host",
    "crates/severity",
    "crates/lsp-common",
    "crates/lsp-rpgle",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/quartz-systems-code-for-qs400"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
host-rpc = { path = "crates/host-rpc" }
# QAP client from QS/400 Access, pinned by commit. qsa-net comes from the
# same commit: its `Trust` is what a `qap_client::Target` takes, and its log
# sink carries qap-client's log lines.
qap-client = { git = "https://github.com/quartzsystems/quartz-systems-access", rev = "90d9bba2a0f84d88e749e15cf8ed974540c905eb" }
qsa-net = { git = "https://github.com/quartzsystems/quartz-systems-access", rev = "90d9bba2a0f84d88e749e15cf8ed974540c905eb" }
# The QS/400 compiler front-ends, pinned by commit (V1R1M0), apart from the
# commit qap-client carries for qap-proto. Each builds with `front` only:
# the reader, the parser and `analysis::analyze`. compdiag has no features
# (its `front` module is always built), so it takes none.
rpgfront = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false, features = ["front"] }
cl = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false, features = ["front"] }
dds = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false, features = ["front"] }
sql = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false, features = ["front"] }
cmd = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false, features = ["front"] }
compdiag = { git = "https://github.com/quartzsystems/quartz-systems-400", rev = "5e2bbee93f4055680b96c5e0ebbdbb691f4fc10c", default-features = false }
# The language servers: synchronous, as rust-analyzer's.
lsp-server = "0.10"
lsp-types = "0.97"
crossbeam-channel = "0.5"
severity = { path = "crates/severity" }
lsp-common = { path = "crates/lsp-common" }
lsp-rpgle = { path = "crates/lsp-rpgle" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
