[workspace]
resolver = "3"
members = ["crates/host-rpc", "crates/code-host"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Quartz Systems"]
repository = "https://github.com/quartzsystems/quartz-systems-code-for-qs400"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
host-rpc = { path = "crates/host-rpc" }
# QAP client from QS/400 Access, pinned by commit. qsa-net comes from the
# same commit: its `Trust` is what a `qap_client::Target` takes, and its log
# sink carries qap-client's log lines.
qap-client = { git = "https://github.com/quartzsystems/quartz-systems-access", rev = "1afe1b41bd1a02af1276d81e64885054e8c54d6e" }
qsa-net = { git = "https://github.com/quartzsystems/quartz-systems-access", rev = "1afe1b41bd1a02af1276d81e64885054e8c54d6e" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
