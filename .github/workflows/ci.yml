name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-naming.sh also reads commit messages

      - name: Naming check
        run: scripts/check-naming.sh

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (host/rust-toolchain.toml)
        working-directory: host
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host

      - name: cargo fmt
        working-directory: host
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: host
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: host
        run: cargo test --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: Build host into bin/
        run: scripts/package.sh --host-only

      - name: npm test
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm test
          else
            npm test
          fi

      - name: Package VSIX
        run: scripts/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-for-qs400-${{ matrix.target }}.vsix
          path: code-for-qs400-${{ matrix.target }}.vsix
          if-no-files-found: error
